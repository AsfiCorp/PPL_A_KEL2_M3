<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Araya Business Hub - API Modul M3 (Scalar)</title>
    <meta name="description" content="Dokumentasi Resmi RESTful API Modul 3 (Manajemen Partner & Pendaftaran Mitra) Araya Business Hub Platform." />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e0e10;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        spec: {
          url: './openapi.yaml',
        },
        theme: 'purple',
        layout: 'modern',
        showSidebar: true,
        darkMode: true,
        searchHotKey: 'k',
        metaData: {
          title: 'Araya Business Hub - API Modul M3',
          description: 'Dokumentasi Resmi API Modul 3: Manajemen Partner & Pendaftaran Mitra'
        }
      });
    </script>
  </body>
</html>
