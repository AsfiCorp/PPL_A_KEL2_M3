name: CI Pipeline

on:
  push:
    branches:
      - main
      - test
      - 'feature/**'
  pull_request:
    branches:
      - main
      - test

jobs:
  test:
    name: Run Migrations & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Unit Tests
        run: |
          python manage.py test partners -v 2
